  <rect x="58" y="78" width="54" height="8" rx="4" fill="#1B2A4A" opacity="0.2"/>
  <rect x="58" y="96" width="72" height="6" rx="3" fill="#1B2A4A" opacity="0.12"/>
  <circle cx="78" cy="136" r="7" fill="#1B2A4A"/>
