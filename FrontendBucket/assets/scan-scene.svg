<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" fill="none" aria-hidden="true">
  <!-- Soft ambient glow -->
  <ellipse cx="180" cy="168" rx="140" ry="90" fill="#C4A574" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Orbit rings -->
  <ellipse cx="180" cy="160" rx="118" ry="78" stroke="#C4A574" stroke-width="1.2" opacity="0.28" stroke-dasharray="4 8">
    <animateTransform attributeName="transform" type="rotate" values="0 180 160;360 180 160" dur="28s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="180" cy="160" rx="92" ry="58" stroke="#FFFFFF" stroke-width="1" opacity="0.16" stroke-dasharray="2 10">
    <animateTransform attributeName="transform" type="rotate" values="360 180 160;0 180 160" dur="22s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Floating network nodes -->
  <g opacity="0.55">
    <circle cx="68" cy="96" r="4" fill="#C4A574">
      <animate attributeName="cy" values="96;88;96" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="292" cy="112" r="3.5" fill="#FFFFFF">
      <animate attributeName="cy" values="112;104;112" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="86" cy="210" r="3" fill="#FFFFFF" opacity="0.7">
      <animate attributeName="cy" values="210;202;210" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="278" cy="206" r="4" fill="#C4A574">
      <animate attributeName="cy" values="206;198;206" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <path d="M68 96 L120 130 M292 112 L240 138 M86 210 L130 180 M278 206 L230 176" stroke="#C4A574" stroke-width="1" opacity="0.35"/>
  </g>

  <!-- Soft ground shadow -->
  <ellipse cx="180" cy="268" rx="70" ry="10" fill="#000000" opacity="0.22">
    <animate attributeName="rx" values="70;62;70" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22;0.14;0.22" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Floating business card (behind mascot slightly) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.6s" repeatCount="indefinite"/>
    <rect x="108" y="118" width="144" height="92" rx="14" fill="#F7F3EB" stroke="#1B2A4A" stroke-width="3"/>
    <rect x="124" y="136" width="48" height="7" rx="3.5" fill="#1B2A4A" opacity="0.22"/>
    <rect x="124" y="150" width="72" height="5" rx="2.5" fill="#1B2A4A" opacity="0.12"/>
    <rect x="124" y="162" width="64" height="5" rx="2.5" fill="#1B2A4A" opacity="0.12"/>
    <rect x="124" y="174" width="40" height="5" rx="2.5" fill="#C4A574" opacity="0.55"/>
    <!-- Scan beam on card -->
    <rect x="116" y="140" width="128" height="3" rx="1.5" fill="#C4A574" opacity="0.85">
      <animate attributeName="y" values="130;190;130" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Mascot character (paper buddy) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3.2s" repeatCount="indefinite"/>
    <!-- Body -->
    <rect x="148" y="54" width="64" height="86" rx="14" fill="#F4F0E8" stroke="#1B2A4A" stroke-width="3.5"/>
    <!-- Text lines -->
    <rect x="160" y="70" width="28" height="5" rx="2.5" fill="#1B2A4A" opacity="0.2"/>
    <rect x="160" y="82" width="36" height="4" rx="2" fill="#1B2A4A" opacity="0.12"/>
    <!-- Face -->
    <circle cx="164" cy="108" r="4.5" fill="#1B2A4A"/>
    <circle cx="196" cy="108" r="4.5" fill="#1B2A4A"/>
    <path d="M168 120c6 7 18 7 24 0" stroke="#1B2A4A" stroke-width="3" stroke-linecap="round"/>
    <!-- Copper badge -->
    <circle cx="200" cy="64" r="10" fill="#C4A574">
      <animate attributeName="r" values="10;11.5;10" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="64" r="4.5" fill="#F4F0E8"/>
    <!-- Little arms / motion sparks -->
    <circle cx="140" cy="96" r="3" fill="#C4A574" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="88" r="2.5" fill="#FFFFFF" opacity="0.6">
      <animate attributeName="opacity" values="0.15;0.85;0.15" dur="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Soft sparkles -->
  <g fill="#C4A574">
    <path d="M52 150 l3 8 8 3 -8 3 -3 8 -3-8 -8-3 8-3 z" opacity="0.55">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M304 150 l2.5 6.5 6.5 2.5 -6.5 2.5 -2.5 6.5 -2.5-6.5 -6.5-2.5 6.5-2.5 z" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
